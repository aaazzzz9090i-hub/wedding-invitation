```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sarah & Moamen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- OPENING SCENE -->
    <section class="opening" id="opening">

        <div class="scene">

            <div class="envelope-wrapper" id="envelope">

                <div class="envelope">

                    <!-- Letter INSIDE the envelope -->
                    <div class="letter">
                        <div class="letter-inner">

                            <div class="small-title">
                                TOGETHER WITH THEIR FAMILIES
                            </div>

                            <h1>Sarah</h1>

                            <div class="and">&</div>

                            <h1>Moamen</h1>

                            <div class="gold-line"></div>

                            <div class="info">
                                <span>5 OCTOBER 2026</span>
                                <span>AL RAMI HALL</span>
                            </div>

                            <p>
                                Two hearts, one beautiful beginning.
                            </p>

                        </div>
                    </div>

                    <!-- Envelope body -->
                    <div class="envelope-body">

                        <div class="paper"></div>

                        <div class="left-fold"></div>

                        <div class="right-fold"></div>

                        <div class="bottom-fold"></div>

                        <!-- Envelope flap -->
                        <div class="flap"></div>

                    </div>

                    <!-- Wax / Gold seal -->
                    <button class="seal" id="seal">
                        <span>S</span>
                        <small>&</small>
                        <span>M</span>
                    </button>

                </div>

            </div>

            <div class="tap-text">
                TAP THE SEAL TO OPEN
            </div>

        </div>

    </section>


    <!-- FINAL INVITATION -->
    <section class="invitation" id="invitation">

        <div class="invitation-card">

            <div class="ornament">✦</div>

            <div class="small-title">
                TOGETHER WITH THEIR FAMILIES
            </div>

            <h2>Sarah</h2>

            <div class="big-and">&</div>

            <h2>Moamen</h2>

            <div class="gold-line"></div>

            <div class="final-info">

                <div>
                    <span>DATE</span>
                    <strong>5 OCTOBER 2026</strong>
                </div>

                <div>
                    <span>VENUE</span>
                    <strong>AL RAMI HALL</strong>
                </div>

            </div>

            <p class="quote">
                Two hearts, one beautiful beginning.
            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
```
