<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sarah & Moamen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- OPENING -->
    <main class="opening" id="opening">

        <div class="camera">

            <div class="envelope-scene">

                <div class="envelope" id="envelope">

                    <!-- LETTER INSIDE -->
                    <div class="letter" id="letter">

                        <div class="letter-content">

                            <div class="mini-title">
                                TOGETHER WITH THEIR FAMILIES
                            </div>

                            <div class="name">
                                Sarah
                            </div>

                            <div class="ampersand">
                                &
                            </div>

                            <div class="name">
                                Moamen
                            </div>

                            <div class="line"></div>

                            <div class="date">
                                5 OCTOBER 2026
                            </div>

                            <div class="venue">
                                AL RAMI HALL
                            </div>

                            <div class="quote">
                                Two hearts, one beautiful beginning.
                            </div>

                        </div>

                    </div>


                    <!-- ENVELOPE BACK -->
                    <div class="envelope-back"></div>


                    <!-- LEFT TRIANGLE -->
                    <div class="fold left"></div>


                    <!-- RIGHT TRIANGLE -->
                    <div class="fold right"></div>


                    <!-- BOTTOM TRIANGLE -->
                    <div class="fold bottom"></div>


                    <!-- TOP FLAP -->
                    <div class="flap" id="flap"></div>


                    <!-- GOLD SEAL -->
                    <button class="seal" id="seal">

                        <span>S</span>
                        <small>&</small>
                        <span>M</span>

                    </button>

                </div>

            </div>


            <div class="instruction" id="instruction">
                TAP THE SEAL TO OPEN
            </div>

        </div>

    </main>


    <!-- FINAL INVITATION -->

    <section class="invitation" id="invitation">

        <div class="invitation-card">

            <div class="star">✦</div>

            <div class="mini-title">
                TOGETHER WITH THEIR FAMILIES
            </div>

            <div class="final-name">
                Sarah
            </div>

            <div class="final-ampersand">
                &
            </div>

            <div class="final-name">
                Moamen
            </div>

            <div class="line"></div>

            <div class="details">

                <div>
                    <span>DATE</span>
                    <strong>5 OCTOBER 2026</strong>
                </div>

                <div>
                    <span>VENUE</span>
                    <strong>AL RAMI HALL</strong>
                </div>

            </div>

            <p>
                Two hearts, one beautiful beginning.
            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
