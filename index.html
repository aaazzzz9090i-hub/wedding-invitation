<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manem & Sara | Wedding Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="opening" id="opening">

        <div class="opening-title">
            <span>A SPECIAL INVITATION</span>
        </div>

        <div class="camera">

            <div class="envelope-area" id="envelope">

                <div class="envelope">

                    <div class="inside-letter">
                        <div class="mini-letter">
                            <span>Manem</span>
                            <small>&</small>
                            <span>Sara</span>
                        </div>
                    </div>

                    <div class="envelope-body">

                        <div class="envelope-paper"></div>

                        <div class="left-fold"></div>
                        <div class="right-fold"></div>

                        <div class="bottom-fold"></div>

                        <div class="flap">
                            <div class="flap-inner"></div>
                        </div>

                    </div>

                    <button class="seal" id="seal">
                        <span>M</span>
                        <b>&</b>
                        <span>S</span>
                    </button>

                </div>

            </div>

        </div>

        <div class="open-text">
            TAP TO OPEN
        </div>

        <div class="hint">
            A beautiful beginning awaits
        </div>

    </main>


    <section class="invitation" id="invitation">

        <div class="invitation-border">

            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>

            <div class="invitation-content">

                <div class="small-heading">
                    WEDDING INVITATION
                </div>

                <div class="names">
                    <span>Manem</span>

                    <div class="ampersand">&</div>

                    <span>Sara</span>
                </div>

                <div class="ornament">
                    <span></span>
                    <i>✦</i>
                    <span></span>
                </div>

                <div class="details">

                    <div class="detail">
                        <small>DATE</small>
                        <strong>5 OCTOBER 2026</strong>
                    </div>

                    <div class="divider"></div>

                    <div class="detail">
                        <small>VENUE</small>
                        <strong>Wahet Elramy</strong>
                    </div>

                </div>

                <p class="quote">
                    Two hearts, one beautiful beginning.
                </p>

                <div class="closing">
                    <span></span>
                    <b>With Love</b>
                    <span></span>
                </div>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
